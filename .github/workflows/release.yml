name: Build Signed APK on Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/keystore.jks

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-configuration-cache
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Locate built APK
        run: |
          APK=$(find app -name "*.apk" -path "*/release/*" ! -name "*unsigned*" ! -name "*debug*" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "No signed release APK found" >&2
            exit 1
          fi
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          echo "Found APK at: $APK"

      - name: Upload APK to release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.APK_PATH }}
          asset_name: OptHelioG99-${{ github.event.release.tag_name }}.apk
          tag: ${{ github.event.release.tag_name }}
          overwrite: true

      - name: Upload APK as artifact (manual run)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: OptHelioG99-${{ github.sha }}
          path: ${{ env.APK_PATH }}
