# Battery profile — OptHelioG99
# Maximum power saving. Lower refresh rate, minimal background, no bloat.
# Applied modules: gpu, cpu, memory, display, debloat

[gpu]
composition_type=gpu
gralloc_ubwc=1
egl_hw=1
egl_swapinterval=1
egl_buffcount=2
msaa_sample_count=1
force_msaa=0
disable_msaa=1
gpu_pixel_buffers=1
render_thread_count=2
skia_num_render_threads=2
hwui_target_cpu_percent=40
hwui_target_gpu_percent=20

[cpu]
activity_starts_logging=0
fixed_perf_mode=false
sched_colocate=0
dynamic_samplingrate=1
background_boot_services=1
zygote_preload_threads=1

[memory]
zram_enabled=1
app_standby=1
minfree_8g=24576,32768,49152,196608,458752,655360
io_prefetcher=0
cache_clean=1
scrollingcache=1
fstrim_interval=86400000

[display]
peak_refresh_rate=60.0
min_refresh_rate=60.0
user_refresh_rate=60.0
window_scale=0.5
transition_scale=0.5
animator_scale=0.5
disable_hw_overlays=0
disable_window_blurs=0

[debloat]
debloat_mode=full
dry_run=false
restore_first=false
