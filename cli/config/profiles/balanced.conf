# Balanced profile — OptHelioG99
# Applied modules: gpu, cpu, memory, display, debloat
# Runtime-only (resets on reboot). All debug.* setprop changes are transient.

[gpu]
# Composition: force GPU composition (reduces HWC bypass for Mali)
composition_type=gpu
gralloc_ubwc=1
egl_hw=1
egl_swapinterval=1
egl_buffcount=4
msaa_sample_count=1
force_msaa=0
disable_msaa=1
gpu_pixel_buffers=1
render_thread_count=4
skia_num_render_threads=4
hwui_target_cpu_percent=72
hwui_target_gpu_percent=40

[cpu]
# Scheduler hints (cannot change governor without root)
activity_starts_logging=0
fixed_perf_mode=false
sched_colocate=1
dynamic_samplingrate=1
background_boot_services=3
zygote_preload_threads=2

[memory]
zram_enabled=1
app_standby=1
lru_first_pass=1
minfree_8g=16384,20480,32768,131072,384000,524288
io_prefetcher=1
cache_clean=1
scrollingcache=3
fstrim_interval=86400000

[display]
# Refresh rate: lock to 120Hz
peak_refresh_rate=120.0
min_refresh_rate=60.0
user_refresh_rate=120.0
# Animations: faster but not disabled
window_scale=0.5
transition_scale=0.5
animator_scale=0.5
# Features: disable hw overlays for GPU composition
disable_hw_overlays=0
disable_window_blurs=0

[debloat]
# true = dry-run (print but don't disable), false = actually disable
dry_run=true
# true = re-enable disabled packages first, false = skip re-enable
restore_first=false
