# Performance profile — OptHelioG99
# PEAK hardware push — Honor of Kings / Genshin Impact
# Strategy: force maximum CPU+GPU utilization, remove all throttling

[gpu]
composition_type=gpu
gralloc_ubwc=1
egl_hw=1
egl_swapinterval=1
egl_buffcount=4
msaa_sample_count=1
force_msaa=0
disable_msaa=1
gpu_pixel_buffers=1
render_thread_count=8
skia_num_render_threads=8
hwui_target_cpu_percent=200
hwui_target_gpu_percent=200

[cpu]
activity_starts_logging=0
fixed_perf_mode=true
sched_colocate=1
dynamic_samplingrate=1
background_boot_services=2
zygote_preload_threads=4

[memory]
zram_enabled=0
app_standby=0
minfree_8g=8192,12288,16384,65536,262144,393216
io_prefetcher=1
cache_clean=1
scrollingcache=3
fstrim_interval=86400000

[display]
peak_refresh_rate=120.0
min_refresh_rate=120.0
user_refresh_rate=120.0
window_scale=0.0
transition_scale=0.0
animator_scale=0.0
disable_hw_overlays=1
disable_window_blurs=1

[debloat]
debloat_mode=full
dry_run=false
restore_first=false
